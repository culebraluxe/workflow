[package]
name = "workflow-neon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
workflow-core = { path = "../workflow-core" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "chrono",
    "derive",
    "json",
] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
